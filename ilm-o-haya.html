<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ilm o Haya — Ilm o Amal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --ground:#F3F5F2; --paper:#FFFFFF; --ink:#1B2622; --muted:#5B6A64; --rule:#D8E0DB;
  --accent:#1E6B4B; --accent-soft:#E3EFE8; --accent-ink:#FFFFFF;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --urdu:"Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101614; --paper:#161E1B; --ink:#E4EBE7; --muted:#96A69F; --rule:#2A3531;
    --accent:#6CC79A; --accent-soft:#1C2B25; --accent-ink:#0E1512; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#101614; --paper:#161E1B; --ink:#E4EBE7; --muted:#96A69F; --rule:#2A3531;
  --accent:#6CC79A; --accent-soft:#1C2B25; --accent-ink:#0E1512; color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{text-decoration:none;font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--accent);display:flex;gap:8px;align-items:baseline}
.brand .u{font-family:var(--urdu);font-weight:600;font-size:15px;line-height:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui)}
.switch .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 14px/1 var(--ui);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[data-l="ur"]{font-family:var(--urdu);font-size:14px;padding-block:6px 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:40px 64px}
header.hero{padding-block:8px 28px;border-bottom:1px solid var(--rule);margin-bottom:8px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6vw,48px);line-height:1.1;margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
.sub{font-size:19px;line-height:1.55;color:var(--muted);margin:0;max-width:62ch}
.credit{font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:16px}

section{padding-block:30px 6px}
h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.3;margin:0 0 14px;text-wrap:balance}
p{font-size:18px;line-height:1.7;margin:0 0 14px;max-width:66ch}

.ref{margin:18px 0 6px;background:var(--accent-soft);border-radius:10px;padding:16px 18px}
.ref .tag{font-family:var(--ui);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 10px}
.ref p{font-size:16.5px;line-height:1.65;margin:0 0 10px;font-style:italic}
.ref p:last-child{margin-bottom:0}

.foot{margin-top:44px;padding-top:24px;border-top:1px solid var(--rule)}
.foot h2{font-size:20px}
.foot ul{margin:0 0 20px;padding-inline-start:20px;font-family:var(--ui);font-size:15px;line-height:1.9;font-variant-numeric:tabular-nums}
.note{font-family:var(--ui);font-size:14px;line-height:1.6;color:var(--muted)}

/* Urdu */
[dir="rtl"] main{font-family:var(--urdu)}
[dir="rtl"] h1{font-family:var(--urdu);font-size:clamp(28px,5vw,40px);line-height:2;letter-spacing:0;font-weight:700}
[dir="rtl"] .sub{font-family:var(--urdu);font-size:17px;line-height:2.3}
[dir="rtl"] h2{font-family:var(--urdu);font-size:21px;line-height:2.1;font-weight:700}
[dir="rtl"] p{font-family:var(--urdu);font-size:17px;line-height:2.4}
[dir="rtl"] .ref p{font-style:normal;font-size:15.5px;line-height:2.3}
[dir="rtl"] .ref .tag,[dir="rtl"] .credit,[dir="rtl"] .note,[dir="rtl"] .foot ul{font-family:var(--urdu);letter-spacing:0;text-transform:none;line-height:2.2}
[dir="rtl"] .foot ul{font-size:15px}
@media (max-width:520px){
  .bar-in{justify-content:center}
  .brand{display:none}
  .switch .lbl{display:none}
  p{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){ #doc{transition:opacity .18s ease} #doc.fade{opacity:.35} }

/* cover */
.byline{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--ink);margin:-6px 0 0}
[dir="rtl"] .byline{font-family:var(--urdu);line-height:2;margin:0}
.cover{padding-block:12px 32px;border-bottom:1px solid var(--rule);margin-bottom:8px;display:grid;gap:18px}
.kicker{font-family:var(--ui);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}
.cover h1{margin:0}
.cover .sub{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;font-family:var(--ui)}
.meta li{font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:6px 12px}
.for{font-family:var(--ui);font-size:14px;color:var(--muted);margin:0}
.go{justify-self:start;display:inline-flex;align-items:center;gap:8px;font:700 15px/1 var(--ui);color:var(--accent-ink);background:var(--accent);text-decoration:none;padding:13px 20px;border-radius:999px}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pull{margin:6px 0 0;padding:18px 0 0;border-top:1px solid var(--rule);font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.45;color:var(--ink);max-width:40ch;text-wrap:balance}
.pull::before{content:"“";color:var(--accent);font-size:1.4em;line-height:0;vertical-align:-.25em;margin-inline-end:4px}
details.toc{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:4px 18px}
details.toc summary{cursor:pointer;font:700 15px/1 var(--ui);padding-block:14px;color:var(--ink)}
details.toc ol{margin:0 0 14px;padding-inline-start:22px;columns:2 260px;column-gap:28px;font-family:var(--ui);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
details.toc li{margin-bottom:8px;break-inside:avoid}
details.toc a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
details.toc a:hover{color:var(--accent);border-color:var(--accent)}
section{scroll-margin-top:72px}
[dir="rtl"] .kicker,[dir="rtl"] .meta,[dir="rtl"] .for,[dir="rtl"] .go,[dir="rtl"] details.toc summary,[dir="rtl"] details.toc ol{font-family:var(--urdu);letter-spacing:0;text-transform:none}
[dir="rtl"] .kicker{font-size:15px;line-height:2}
[dir="rtl"] .meta li{line-height:2;padding-block:2px 6px}
[dir="rtl"] .for{line-height:2.2}
[dir="rtl"] .go{line-height:2;padding-block:6px 12px}
[dir="rtl"] .pull{font-family:var(--urdu);font-style:normal;font-size:19px;line-height:2.3}
[dir="rtl"] details.toc summary{line-height:2;padding-block:8px}
[dir="rtl"] details.toc ol{line-height:2.2}
[dir="rtl"] .go span{transform:none}
</style>

</head>

    </div>
  </div>
</div></div>

<script>
const D = {"data": {"en": [{"h": "Two days of anger, the same old problem", "p": ["Every day we hear news of another rape, harassment or sexual assault.", "Then what happens? People post stories, change their profile pictures, write \"Justice for…\". Everyone gets angry, comments, tags each other.", "Two days later it all disappears. A new incident, a new hashtag, new anger — and the same old cycle starts again."], "r": []}, {"h": "The real question we never ask", "p": ["Why do we only wake up after a crime has happened?", "Why don't we teach our children about the body, desire, boundaries, modesty and responsibility before that age — when all of these begin to awaken inside them?", "The problem isn't only what children are watching. It's also what they have been told about reality."], "r": []}, {"h": "Puberty is not something shameful", "p": ["Puberty is a normal, natural stage of human growth.", "Remember school days? One boy's voice would deepen, another would grow facial hair, someone would have a wet dream for the first time — and instead of understanding it, the child felt ashamed.", "Why? Because no one gave us the knowledge. We were only told: \"we don't talk about this.\"", "Physically, one part of the brain signals the glands, and the glands release hormones — testosterone in boys, estrogen in girls. The body changes not only on the outside but on the inside, and so does the brain."], "r": ["The Quran itself treats puberty as a recognised stage. Surah An-Nur (24:58–59) teaches children to ask permission before entering rooms at certain times, and says that once children reach puberty they should ask permission just as adults do. Privacy, boundaries and puberty are addressed openly in the Quran."]}, {"h": "The mind and emotions change with the body", "p": ["At this age, emotions, decision-making and sensitivity towards others change too.", "Peer pressure is felt strongly, appearance becomes a worry, and attraction and sexual curiosity can appear.", "None of this proves the child has gone bad — it's a sign they are moving from childhood into adolescence.", "But remember one big difference: feeling something and acting on it are two separate things. Feelings aren't always in our control; our gaze, our words, our actions and our limits are our own responsibility."], "r": []}, {"h": "Islam taught modesty, not silence", "p": ["Sometimes we treat modesty as if learning about the body were itself immodest. Yet the Quran teaches modesty, not ignorance.", "Islam did not deny that desire exists — it gave it direction and limits.", "That's why it doesn't only say \"do not commit zina\" — it teaches us to avoid the paths that lead towards it.", "And asking questions is not forbidden — the Quran itself says: ask those who have knowledge."], "r": ["Surah An-Nur (24:30–31): both men and women are told to lower their gaze and guard their chastity. The first address is to men.", "Surah Al-Isra (17:32): do not even go near zina — not only the act, but the paths leading to it.", "Surah An-Nahl (16:43) / Al-Anbiya (21:7): if you do not know, ask those who know — seeking knowledge is a command, not a fault."]}, {"h": "Where the problem really begins", "p": ["A child begins to mature physically, but asking questions at home is treated as a sin.", "When the reproduction chapter comes up at school, students are told \"read this at home\", or it's skipped altogether.", "Ask about the body and the answer is: \"quiet, these are dirty things.\"", "A boy is frightened by his first wet dream, a girl panics at her first period — and then we wonder why children learn everything from the internet."], "r": ["Hadith: Umm Sulaym (RA) openly asked the Prophet ﷺ whether a woman must perform ghusl after a wet dream, and he answered without embarrassment (Sahih Muslim, Book of Menstruation).", "Aisha (RA) praised the women of the Ansar because shyness did not stop them from learning their religion (Sahih Muslim). Asking questions is not against modesty."]}, {"h": "What silence about periods leads to", "p": ["In one UNICEF survey, 49% of respondents said they knew nothing about menstruation before their first period.", "Imagine an 11- or 12-year-old girl suddenly seeing blood and not knowing what it is — she will think she is ill, that something is wrong with her body, or that she has sinned.", "We need to understand the difference: shame and modesty are not the same. Modesty gives a person dignity; misplaced shame stops a person from asking.", "And when a child can't ask, they look for answers somewhere else."], "r": ["Surah Al-Baqarah (2:222): the Companions asked about menstruation, and the Quran answered clearly. The very topic we hide as \"dirty\", the Quran addressed as a real matter of the human body."]}, {"h": "The internet is not always a teacher", "p": ["When young people don't get accurate, age-appropriate information, the internet becomes their teacher.", "But porn is not a biology textbook, not a documentary about love, not training for relationships — and above all, it is no standard of consent.", "Watching such content again and again can shape distorted ideas about relationships and intimacy.", "Still, remember: not every sexual crime is caused by porn. Power, entitlement, hatred of women, anger and opportunity are causes too."], "r": []}, {"h": "Consent — not just an English word", "p": ["At its root it means respecting another person's body and boundaries.", "Someone's silence is not consent. Fear is not consent. Helplessness is not consent. An existing relationship is not consent. And clothing is certainly not consent.", "Even marriage does not turn a person's body into property without a say."], "r": ["Surah An-Nisa (4:19): taking women by force as inheritance is forbidden, and men are commanded to treat them with kindness and fairness — there is no room for coercion even within a relationship.", "Surah An-Nisa (4:1): men and women were created from a single soul — their basic human dignity is equal.", "Surah Al-Baqarah (2:187): spouses are garments for one another — protection, honour and closeness, not ownership."]}, {"h": "Biology: hormones and the cycle", "p": ["At puberty it isn't only sex hormones that rise — the whole system settles into a new balance. Nutrition, body composition, genetics, health, stress and environment all play a part.", "\"It's all because of food or the weather\" is too easy an answer; human biology is far more complex.", "A girl's body works in a cycle. Menstruation isn't just four or five days of bleeding — it's a whole orchestra of hormones: an egg maturing, the egg being released, the lining of the womb building up.", "If there is no pregnancy, the lining is shed and the period begins. The cycle doesn't have to be 28 days — anywhere between 21 and 35 days is normal."], "r": []}, {"h": "Period pain is not drama", "p": ["Pain comes from the womb contracting and from certain chemical substances. For some it is mild; for others it's severe enough to affect school or work.", "So the answer shouldn't be \"stop making excuses\", but \"how can I help you?\"", "Mood changes, irritability and fatigue can also happen. But brushing everything off as \"it's just hormones\" is wrong too — hormones can be an explanation, not an excuse."], "r": []}, {"h": "Physical maturity is not emotional maturity", "p": ["Getting a period does not mean a girl has become emotionally mature.", "The body may be able to bear a child, but judgement, emotions, relationships and responsibilities are not yet mature.", "That's why adolescence is so delicate — the body is racing ahead while the mind and personality are still forming."], "r": []}, {"h": "\"Don't do it\" is not enough", "p": ["If you say \"don't watch porn\", the next question will be: \"why?\"", "If the only answer is \"because it's haram\", the child won't understand the psychological and social reasons.", "They also need to understand: bodies on a screen aren't reality, intimacy isn't a performance, another person's body isn't entertainment, and attraction is not the same as action.", "Most importantly: feeling desire is not a sin — choosing the haram path is a person's own responsibility."], "r": ["Surah Yusuf (12:23–24): the Quran does not hide the desire and opportunity Yusuf (AS) faced; it tells us he sought refuge in Allah and held himself back.", "Surah Yusuf (12:33): Yusuf's prayer — \"prison is dearer to me than what they invite me to\" — taqwa is not the absence of desire but mastery over it.", "Surah Yusuf (12:53): the self inclines towards wrong — the Quran acknowledges human nature, then teaches how to train it."]}, {"h": "Islam didn't erase desire — it disciplined it", "p": ["The Quran describes marriage in terms of tranquillity, love and mercy.", "It did not make sexual relations something dirty — it placed them within responsibility and a lawful bond.", "It gave clear guidance even on menstruation.", "Modesty doesn't mean denying biology — it means understanding biology with dignity."], "r": ["Surah Ar-Rum (30:21): spouses were created so that you find tranquillity in them, and love and mercy were placed between you.", "Surah An-Nur (24:33): those who cannot find the means to marry should keep chaste — a path of patience is also shown.", "Surah Al-Mu'minun (23:5–7): the successful believers are those who guard their chastity."]}, {"h": "Who will raise the boys?", "p": ["Telling only girls \"cover up, don't go out alone, stay safe\" is not enough.", "Boys must also be taught: what the gaze is, what a limit is, whether a woman is a person or an object, what \"no\" means, what privacy is, why forwarding someone's photo is wrong, and why sexual pressure is cruelty.", "Most importantly: masculinity does not mean anger and dominance.", "A boy raised on \"men don't cry\" and \"a man must always be in control\" isn't learning manhood — he's learning to mistake power for manhood."], "r": ["Surah An-Nur (24:30): the first command to lower the gaze is given to men — responsibility starts with the boy.", "Surah Al-Ahzab (33:35): men and women who guard their chastity are mentioned side by side, equally."]}, {"h": "Girls need knowledge, not fear", "p": ["She should know what puberty will bring, what a period is, how to keep clean, which signs are normal, when to see a doctor, and how to state her physical boundaries.", "Above all — her body is not a reason for shame.", "Boys too should know that wet dreams, a breaking voice, facial hair and hormonal changes are all natural.", "Asking about them doesn't make anyone dirty — growing up with wrong information is far more dangerous."], "r": []}, {"h": "Silence isn't protection — it's a vacuum", "p": ["Silence doesn't protect — it creates a vacuum, and something always fills it.", "If home doesn't explain, friends will. If friends don't, the internet will. If the internet doesn't, porn will.", "And if porn gives the first lesson, explaining the difference between reality and the screen becomes very hard.", "The aim of sexual and reproductive health education is not to awaken children sexually — it's to give them scientifically accurate, age-appropriate and culturally suitable information."], "r": []}, {"h": "A final word", "p": ["Next time an incident happens, let's not stop at writing \"Justice\" on our story — let's start the conversation at home where a child can ask, \"why is my body changing like this?\" — and get an answer.", "Where a girl isn't terrified by her first period. Where a boy doesn't feel dirty after a wet dream.", "Where parents teach biology with understanding, not shame. Where Islam is used not only to say \"this is haram\", but to explain modesty, purity, responsibility, marriage, the gaze and human dignity.", "Giving a child knowledge of the body doesn't make them immodest — handing them over to wrong knowledge is what's dangerous.", "Remember: modesty isn't what stops you from asking; modesty is what turns knowledge into character.", "Because silence doesn't protect children — the right knowledge, the right upbringing and the right boundaries do."], "r": []}], "ro": [{"h": "Ghussa do din ka, masla purana", "p": ["Har roz humein kisi na kisi rape, chher chaar ya jinsi ziyadati ki khabar sunni parti hai.", "Phir kya hota hai? Log stories lagate hain, profile picture badalte hain, \"Justice for…\" likhte hain. Sab ghussa karte hain, comments karte hain, ek doosre ko tag karte hain.", "Aur do din baad sab ghaayab. Naya waqia, naya hashtag, naya ghussa — aur wohi purana chakkar dobara shuru."], "r": []}, {"h": "Asal sawal jo hum nahi poochhte", "p": ["Hum sirf jurm hone ke baad hi kyun jaagte hain?", "Us umar se pehle apne bachon ko jism, khwahish, hudood, haya aur zimmedari ke baare mein kyun nahi batate — jab un ke andar yeh sab cheezein bedaar hona shuru hoti hain?", "Masla sirf yeh nahi ke bache kya dekh rahe hain. Masla yeh bhi hai ke unhein haqeeqat ke baare mein kya bataya gaya hai."], "r": []}, {"h": "Bulooghat koi buraai nahi", "p": ["Bulooghat insaan ki barhotri ka aam aur qudrati marhala hai.", "Yaad hai school ka zamana? Kisi ki awaaz bhaari hoti, kisi ke chehre par baal aate, kisi ko pehli baar ehtelaam hota — aur bacha samajhne ke bajaye sharminda ho jaata tha.", "Kyun? Kyunke ilm diya hi nahi gaya tha. Sirf itna kaha gaya: \"is mauzoo par baat nahi karni.\"", "Jismani tor par dimagh ka ek hissa ghudood ko signal bhejta hai, ghudood hormones jaari karte hain — larkon mein testosterone, larkiyon mein estrogen. Jism sirf bahar se nahi, andar se bhi badalta hai, aur dimagh bhi."], "r": ["Quran khud bulooghat ko ek pehchana hua marhala maanta hai. Surah An-Nur (24:58–59) mein bachon ko kamron mein aane se pehle ijazat lene ka adab sikhaya gaya, aur kaha gaya ke jab bache bulooghat ko pahunch jayein to unhein bhi bare logon wali tarah ijazat leni chahiye. Yani parde, privacy aur bulooghat ki baat Quran mein saaf mojood hai."]}, {"h": "Jism ke saath dimagh aur jazbaat bhi badalte hain", "p": ["Is umar mein jazbaat, faisle karne ki salahiyat aur doosron ke baare mein hassasiyat bhi badalti hai.", "Doston ka dabaao bohat mehsoos hota hai, apni soorat ki fikar barh jaati hai, aur doosron ki taraf kashish aur tajassus bhi paida ho sakta hai.", "Yeh saboot nahi ke bacha kharab ho gaya — yeh nishani hai ke woh bachpan se nau-umri ki taraf barh raha hai.", "Lekin ek bara farq yaad rahe: ehsaas ka paida hona aur us par amal karna do alag cheezein hain. Ehsaas hamesha qaabu mein nahi hota; nigaah, zubaan, amal aur hudood par insaan ki apni zimmedari hai."], "r": []}, {"h": "Islam ne khamoshi nahi, haya sikhai hai", "p": ["Hum ne haya ko kabhi kabhaar aisa samajh liya hai jaise jism ka ilm haasil karna hi be-hayai ho. Halanke Quran haya sikhata hai, jahalat nahi.", "Islam ne khwahish ke hone se inkaar nahi kiya — use simt aur hudood di hain.", "Isi liye sirf \"zina mat karo\" nahi kaha gaya, balke us ke qareeb le jaane wale raaston se bachne ki taleem di gayi.", "Aur sawal karna mana nahi — Quran khud kehta hai ke jo nahi jaante woh ahl-e-ilm se poochhein."], "r": ["Surah An-Nur (24:30–31): mard aur aurat dono ko hukm — apni nigaahein neechi rakhein aur apni sharmgahon ki hifazat karein. Pehla khitaab mardon se hai.", "Surah Al-Isra (17:32): zina ke qareeb bhi mat jao — yani sirf amal nahi, us tak le jaane wale raaste bhi mana hain.", "Surah An-Nahl (16:43) / Al-Anbiya (21:7): agar tum nahi jaante to jaanne walon se poochho — ilm maangna deen ka hukm hai, aib nahi."]}, {"h": "Masla kahan se shuru hota hai", "p": ["Bacha jismani tor par pukhta hona shuru hota hai, lekin ghar mein sawal karna gunah samjha jaata hai.", "School mein tauleed ka baab aaye to kaha jaata hai \"yeh ghar se parh kar aana\", ya use parhaye baghair chhor diya jaata hai.", "Jism ke baare mein poochho to jawab milta hai: \"chup karo, yeh gandi baatein hain.\"", "Ehtelaam ho to larka darr jaata hai, pehla period aaye to larki ghabra jaati hai — aur phir hum hairan hote hain ke bache internet se sab kuch kyun seekh rahe hain."], "r": ["Hadith: Umm Sulaym (RA) ne Nabi ﷺ se khul kar poochha ke agar aurat ko ehtelaam ho to kya ghusl karna hoga — aur aap ﷺ ne sharmindagi ke baghair jawab diya (Sahih Muslim, Kitab al-Hayd).", "Hazrat Aisha (RA) ne Ansar ki khawateen ki tareef ki ke sharam ne unhein deen ka ilm seekhne se nahi roka (Sahih Muslim). Yani sawal karna haya ke khilaf nahi."]}, {"h": "Mahwari par khamoshi ka nateeja", "p": ["UNICEF ke ek survey mein 49% jawab dene walon ne bataya ke unhein pehle period se pehle mahwari ke baare mein ilm hi nahi tha.", "Sochein, 11 ya 12 saal ki bachi achanak khoon dekhe aur use pata na ho ke yeh kya hai — woh samjhegi ke koi beemari hai, ya jism mein kharabi hai, ya shayad koi gunah ho gaya hai.", "Yahan farq samajhna zaroori hai: sharam aur haya ek nahi. Haya insaan ko ba-waqaar banati hai; ghalat sharam insaan ko sawal karne se rok deti hai.", "Aur jab bacha sawal nahi kar sakta, to jawab kahin aur dhoondta hai."], "r": ["Surah Al-Baqarah (2:222): Sahaba ne mahwari ke baare mein sawal kiya, aur Quran ne us ka saaf jawab diya. Yani jis mauzoo ko hum ganda keh kar chhupate hain, Quran ne use insani jism ka ek haqeeqi maamla bana kar bayan kiya."]}, {"h": "Internet hamesha ustaad nahi hota", "p": ["Jab naujawan ko durust aur umar ke mutabiq maloomat nahi milteen, to internet us ka ustaad ban jaata hai.", "Lekin porn biology ki kitaab nahi, mohabbat ki documentary nahi, rishton ki tarbiyat nahi — aur sab se barh kar razamandi (consent) ka mayaar bilkul nahi.", "Baar baar aisa mawad dekhne se rishton aur qurbat ke baare mein ghalat sochein banti hain.", "Phir bhi yeh yaad rahe: har jinsi jurm ki wajah porn nahi hoti. Taaqat, haq jatana, aurat se nafrat, ghussa aur mauqa — yeh sab bhi wujoohat hain."], "r": []}, {"h": "Razamandi (consent) — sirf angrezi lafz nahi", "p": ["Is ka bunyadi matlab hai doosre insaan ke jism aur hudood ka ehtiraam.", "Kisi ki khamoshi razamandi nahi. Kisi ka darr razamandi nahi. Kisi ki majboori razamandi nahi. Pehle se rishta hona razamandi nahi. Aur kisi ka libaas to bilkul razamandi nahi.", "Shaadi bhi kisi insaan ke jism ko be-ikhtiyar jaidad nahi bana deti."], "r": ["Surah An-Nisa (4:19): auraton ko zabardasti waaris bana lena mana kiya gaya, aur hukm diya gaya ke un ke saath bhalai aur maroof ke saath maamla karo — yani rishte mein bhi jabr ki gunjaish nahi.", "Surah An-Nisa (4:1): mard aur aurat dono ek hi nafs se paida kiye gaye — bunyadi insani hurmat dono ki barabar hai.", "Surah Al-Baqarah (2:187): miyan biwi ek doosre ke liye libaas hain — yani hifazat, izzat aur qurbat, milkiyat nahi."]}, {"h": "Biology: hormones aur cycle", "p": ["Bulooghat mein sirf jinsi hormones nahi barhte — poora nizam naye tawazun mein aata hai. Ghiza, jism ki saakht, genetics, sehat, stress aur mahol sab asar daalte hain.", "\"Yeh sab sirf khane ya mausam ki wajah se hai\" bohat asaan jawab hai; asal mein insani biology bohat pecheeda hai.", "Larki ka jism ek cycle mein kaam karta hai. Mahwari sirf chaar paanch din ka khoon nahi — yeh hormones ka poora orchestra hai: anda tayyar hona, anda kharij hona, reham ka astar banna.", "Agar hamal na ho to yeh astar kharij ho jaata hai aur mahwari shuru hoti hai. Yeh cycle har larki mein 28 din ka hona zaroori nahi — 21 se 35 din ke darmiyan bhi normal hai."], "r": []}, {"h": "Period ka dard drama nahi hai", "p": ["Reham ke sikurne aur kuch kemiyai maadon ki wajah se dard hota hai. Kisi ko halka, kisi ko itna shadeed ke school ya kaam mutasir ho jaaye.", "Is liye jawab \"bahana mat karo\" nahi hona chahiye, balke \"tumhein kis tarah madad chahiye?\"", "Mood ki tabdeeli, chirchirapan aur thakaawat bhi ho sakti hai. Lekin har baat ko \"hormones hain, nazar-andaaz karo\" kehna bhi ghalat hai — hormones wazahat ho sakte hain, bahana nahi."], "r": []}, {"h": "Jismani pukhtagi aur jazbaati pukhtagi ek cheez nahi", "p": ["Period aa jaane ka matlab yeh nahi ke larki jazbaati tor par baaligh bhi ho gayi.", "Jism bacha paida karne ke qaabil ho sakta hai, lekin faisle, jazbaat, rishte aur zimmedariyan abhi pukhta nahi hoteen.", "Isi liye nau-umri ka daur itna nazuk hai — jism aage barh raha hota hai, dimagh aur shakhsiyat abhi ban rahe hote hain."], "r": []}, {"h": "Sirf \"yeh mat karo\" kehna kaafi nahi", "p": ["Agar aap kahein \"porn mat dekho\", to agla sawal aayega: \"kyun?\"", "Agar jawab sirf \"haraam hai\" ho, to bacha us ki nafsiyati aur samaji wajah nahi samjhega.", "Use yeh bhi samjhana hoga: screen par dikhaya gaya jism haqeeqat nahi hota, qurbat ka matlab performance nahi, doosre ka jism tafreeh nahi, kashish aur amal ek cheez nahi.", "Aur sab se aham: khwahish ka paida hona gunah nahi — haraam raasta chunna insaan ki apni zimmedari hai."], "r": ["Surah Yusuf (12:23–24): Yusuf (AS) ke saamne maujood khwahish aur mauqe ko Quran ne chhupaya nahi, balke bataya ke unhon ne Allah ki panah maangi aur khud ko roka.", "Surah Yusuf (12:33): Yusuf (AS) ki dua — \"mujhe jail is se zyada pasand hai jis ki taraf yeh log bula rahe hain\" — yani taqwa ka matlab khwahish ka na hona nahi, us par qaabu paana hai.", "Surah Yusuf (12:53): nafs buraai ki taraf khinchta hai — Quran insani fitrat ko maanta hai, phir us ki tarbiyat sikhata hai."]}, {"h": "Islam ne khwahish ko khatam nahi kiya — discipline kiya", "p": ["Quran ne nikah ko sukoon, mohabbat aur rehmat ke saath bayan kiya.", "Jinsi taalluq ko gandi cheez nahi banaya — use zimmedari aur halal rishte ke daayre mein rakha.", "Mahwari jaise mauzoo par bhi wazeh hidayat di.", "Haya ka matlab biology se inkaar nahi — biology ko waqaar ke saath samajhna hai."], "r": ["Surah Ar-Rum (30:21): joRe banaye gaye taake sukoon milay, aur darmiyan mohabbat aur rehmat rakhi gayi.", "Surah An-Nur (24:33): jinhein nikah ka moqa na mile, woh paakdaamani ikhtiyar karein — yani sabr ke saath ek raasta bhi bataya gaya.", "Surah Al-Mu'minun (23:5–7): kaamyab momineen woh hain jo apni sharmgahon ki hifazat karte hain."]}, {"h": "Larkon ki tarbiyat kaun karega?", "p": ["Sirf larkiyon ko \"libaas sambhalo, akele mat jao, bach kar raho\" kehna kaafi nahi.", "Larkon ko bhi sikhana hoga: nigaah kya hai, hadd kya hai, aurat insaan hai ya cheez, \"nahi\" ka matlab kya hai, kisi ki privacy kya hai, kisi ki tasveer aage share karna kyun ghalat hai, aur jinsi dabaao kyun zulm hai.", "Sab se aham: mardangi ka matlab ghussa aur dabaao nahi.", "Jis larke ko bachpan se sikhaya jaaye ke \"mard rote nahi\" aur \"mard ko haawi rehna chahiye\", woh mardangi nahi — taaqat ko mardangi samajhna seekh raha hai."], "r": ["Surah An-Nur (24:30): nigaah neechi rakhne ka pehla hukm mardon ko diya gaya — zimmedari larke se shuru hoti hai.", "Surah Al-Ahzab (33:35): paakdaamani ki hifazat karne wale mard aur khawateen — dono ka zikr barabar kiya gaya."]}, {"h": "Larkiyon ko khauf nahi, ilm chahiye", "p": ["Use pata hona chahiye: bulooghat mein kya hoga, period kya hai, safai kaise rakhein, kaun si alamat normal hai, kab doctor se baat karni hai, aur apni jismani hudood kaise batani hain.", "Sab se barh kar — us ka jism sharam ki wajah nahi hai.", "Larke ko bhi jaanna chahiye ke ehtelaam, awaaz ka badalna, chehre ke baal aur hormone ki tabdeeliyan qudrati amal hain.", "In par sawal karna use ganda nahi banata — ghalat maloomat ke saath bara hona zyada khatarnaak hai."], "r": []}, {"h": "Khamoshi tahaffuz nahi, khaali pan hai", "p": ["Khamoshi hifazat nahi karti — woh ek vacuum banati hai, aur vacuum kuch na kuch bhar hi deta hai.", "Ghar ne nahi bataya to dost batayenge. Doston ne nahi bataya to internet batayega. Internet ne nahi bataya to porn batayega.", "Aur agar porn ne pehla sabaq parha diya, to haqeeqat aur screen ka farq samjhana bohat mushkil ho jaata hai.", "Jinsi aur taulidi sehat ki taleem ka maqsad bachon ko jagana nahi — unhein science ke lehaz se durust, umar ke mutabiq aur saqafat ke mutabiq maloomat dena hai."], "r": []}, {"h": "Aakhri baat", "p": ["Agli baar koi waqia saamne aaye to sirf story par \"Justice\" likh kar na reh jaayein — ghar mein woh guftagu shuru ka const doc = document.getElementById('doc');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(l){
  const u = D.ui[l], secs = D.data[l];
  let h = `<header class="cover"><p class="kicker">${esc(u.kicker)}</p><h1>${esc(u.title)}</h1><p class="byline">${esc(u.by)}</p><p class="sub">${esc(u.sub)}</p>`
    + `<ul class="meta">` + u.meta.map(m=>`<li>${esc(m)}</li>`).join('') + `</ul>`
    + `<p class="for">${esc(u.for)}</p>`
    + `<a class="go" href="#s1">${esc(u.start)} <span aria-hidden="true">↓</span></a>`
    + `<blockquote class="pull">${esc(u.quote)}</blockquote>`
    + `<details class="toc"><summary>${esc(u.toc)}</summary><ol>` + secs.map((s,i)=>`<li><a href="#s${i+1}">${esc(s.h)}</a></li>`).join('') + `</ol></details>`
    + `</header>`;
  secs.forEach((s,i)=>{
    h += `<section id="s${i+1}"><h2>${esc(s.h)}</h2>` + s.p.map(p=>`<p>${esc(p)}</p>`).join('');
    if (s.r && s.r.length) h += `<aside class="ref"><div class="tag">${esc(u.ref)}</div>` + s.r.map(r=>`<p>${esc(r)}</p>`).join('') + `</aside>`;
    h += `</section>`;
  });
  h += `<div class="foot"><h2>${esc(u.refs)}</h2><ul>` + D.refs[l].map(r=>`<li>${esc(r)}</li>`).join('') + `</ul></div>`;
  doc.innerHTML = h;
  doc.setAttribute('dir', l==='ur' ? 'rtl' : 'ltr');
  doc.setAttribute('lang', l==='ur' ? 'ur' : l==='ro' ? 'ur-Latn' : 'en');
  document.getElementById('lbl').textContent = u.read;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===l));
  try{ localStorage.setItem('ilm-lang', l); }catch(e){}
}
function pick(l){
  doc.classList.add('fade');
  setTimeout(()=>{ render(l); doc.classList.remove('fade'); window.scrollTo({top:0}); }, 120);
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.l)));
let start = 'en';
try{ const s = localStorage.getItem('ilm-lang'); if (s && D.data[s]) start = s; }catch(e){}
const q = new URLSearchParams(location.search).get('lang'); if (q && D.data[q]) start = q;
render(start);
</script>

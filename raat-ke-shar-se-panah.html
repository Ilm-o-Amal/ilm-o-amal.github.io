<style>
:root{
  --ground:#F3F5F2; --paper:#FFFFFF; --ink:#1B2622; --muted:#5B6A64; --rule:#D8E0DB;
  --accent:#1E6B4B; --accent-soft:#E3EFE8; --accent-ink:#FFFFFF;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --urdu:"Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101614; --paper:#161E1B; --ink:#E4EBE7; --muted:#96A69F; --rule:#2A3531;
    --accent:#6CC79A; --accent-soft:#1C2B25; --accent-ink:#0E1512; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#101614; --paper:#161E1B; --ink:#E4EBE7; --muted:#96A69F; --rule:#2A3531;
  --accent:#6CC79A; --accent-soft:#1C2B25; --accent-ink:#0E1512; color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{text-decoration:none;font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--accent);display:flex;gap:8px;align-items:baseline}
.brand .u{font-family:var(--urdu);font-weight:600;font-size:15px;line-height:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui)}
.switch .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 14px/1 var(--ui);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[data-l="ur"]{font-family:var(--urdu);font-size:14px;padding-block:6px 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:40px 64px}
header.hero{padding-block:8px 28px;border-bottom:1px solid var(--rule);margin-bottom:8px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,6vw,48px);line-height:1.1;margin:0 0 14px;text-wrap:balance;letter-spacing:-.01em}
.sub{font-size:19px;line-height:1.55;color:var(--muted);margin:0;max-width:62ch}
.credit{font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:16px}

section{padding-block:30px 6px}
h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.3;margin:0 0 14px;text-wrap:balance}
p{font-size:18px;line-height:1.7;margin:0 0 14px;max-width:66ch}

.ref{margin:18px 0 6px;background:var(--accent-soft);border-radius:10px;padding:16px 18px}
.ref .tag{font-family:var(--ui);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 10px}
.ref p{font-size:16.5px;line-height:1.65;margin:0 0 10px;font-style:italic}
.ref p:last-child{margin-bottom:0}

.foot{margin-top:44px;padding-top:24px;border-top:1px solid var(--rule)}
.foot h2{font-size:20px}
.foot ul{margin:0 0 20px;padding-inline-start:20px;font-family:var(--ui);font-size:15px;line-height:1.9;font-variant-numeric:tabular-nums}
.note{font-family:var(--ui);font-size:14px;line-height:1.6;color:var(--muted)}

/* Urdu */
[dir="rtl"] main{font-family:var(--urdu)}
[dir="rtl"] h1{font-family:var(--urdu);font-size:clamp(28px,5vw,40px);line-height:2;letter-spacing:0;font-weight:700}
[dir="rtl"] .sub{font-family:var(--urdu);font-size:17px;line-height:2.3}
[dir="rtl"] h2{font-family:var(--urdu);font-size:21px;line-height:2.1;font-weight:700}
[dir="rtl"] p{font-family:var(--urdu);font-size:17px;line-height:2.4}
[dir="rtl"] .ref p{font-style:normal;font-size:15.5px;line-height:2.3}
[dir="rtl"] .ref .tag,[dir="rtl"] .credit,[dir="rtl"] .note,[dir="rtl"] .foot ul{font-family:var(--urdu);letter-spacing:0;text-transform:none;line-height:2.2}
[dir="rtl"] .foot ul{font-size:15px}
@media (max-width:520px){
  .bar-in{justify-content:center}
  .brand{display:none}
  .switch .lbl{display:none}
  p{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){ #doc{transition:opacity .18s ease} #doc.fade{opacity:.35} }

/* cover */
.byline{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--ink);margin:-6px 0 0}
[dir="rtl"] .byline{font-family:var(--urdu);line-height:2;margin:0}
.cover{padding-block:12px 32px;border-bottom:1px solid var(--rule);margin-bottom:8px;display:grid;gap:18px}
.kicker{font-family:var(--ui);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0}
.cover h1{margin:0}
.cover .sub{margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;font-family:var(--ui)}
.meta li{font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:6px 12px}
.for{font-family:var(--ui);font-size:14px;color:var(--muted);margin:0}
.go{justify-self:start;display:inline-flex;align-items:center;gap:8px;font:700 15px/1 var(--ui);color:var(--accent-ink);background:var(--accent);text-decoration:none;padding:13px 20px;border-radius:999px}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pull{margin:6px 0 0;padding:18px 0 0;border-top:1px solid var(--rule);font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.45;color:var(--ink);max-width:40ch;text-wrap:balance}
.pull::before{content:"“";color:var(--accent);font-size:1.4em;line-height:0;vertical-align:-.25em;margin-inline-end:4px}
details.toc{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:4px 18px}
details.toc summary{cursor:pointer;font:700 15px/1 var(--ui);padding-block:14px;color:var(--ink)}
details.toc ol{margin:0 0 14px;padding-inline-start:22px;columns:2 260px;column-gap:28px;font-family:var(--ui);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
details.toc li{margin-bottom:8px;break-inside:avoid}
details.toc a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
details.toc a:hover{color:var(--accent);border-color:var(--accent)}
section{scroll-margin-top:72px}
[dir="rtl"] .kicker,[dir="rtl"] .meta,[dir="rtl"] .for,[dir="rtl"] .go,[dir="rtl"] details.toc summary,[dir="rtl"] details.toc ol{font-family:var(--urdu);letter-spacing:0;text-transform:none}
[dir="rtl"] .kicker{font-size:15px;line-height:2}
[dir="rtl"] .meta li{line-height:2;padding-block:2px 6px}
[dir="rtl"] .for{line-height:2.2}
[dir="rtl"] .go{line-height:2;padding-block:6px 12px}
[dir="rtl"] .pull{font-family:var(--urdu);font-style:normal;font-size:19px;line-height:2.3}
[dir="rtl"] details.toc summary{line-height:2;padding-block:8px}
[dir="rtl"] details.toc ol{line-height:2.2}
[dir="rtl"] .go span{transform:none}
</style>

<script>
const D = {"data": {"en": [{"h": "Why the night?", "p": ["One of the last surahs of the Quran, Surah Al-Falaq, teaches us to seek refuge from something very specific: \"the evil of darkness when it settles.\"", "There is evil in the daytime too, so why name the night separately? Because at night a person is alone and tired, and their own thoughts weigh on them most heavily.", "This piece answers that question: what the evil of the night is, how it closes in on us, and what the Quran and Sunnah have given us to protect ourselves from it."], "r": ["وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ — \"And from the evil of the darkness when it settles.\" (Surah Al-Falaq 113:3)", "Aisha (RA) narrated that the Prophet ﷺ looked at the moon and said: \"O Aisha, seek refuge with Allah from its evil, for this is the ghasiq when it settles.\" (Jami' at-Tirmidhi 3366)"]}, {"h": "\"Ghasiq\" — more than darkness", "p": ["In Arabic, \"ghasiq\" is the darkness that spreads slowly until it wraps around everything.", "The commentators note that at night, things come out that stay hidden in the light of day. That is true of physical dangers, and it is true of mental ones too.", "For people today, the greatest evil of the night is often the one inside:", "Intrusive thoughts: the thoughts buried under the noise of the day raise their heads like a snake in the silence of the night.", "Regrets: by day we think about tomorrow; at night yesterday comes back — old words, old mistakes, old wounds."], "r": []}, {"h": "The 2 a.m. \"mountain\"", "p": ["Has a problem ever felt like a mountain at night, only to look small when you woke up? There is a scientific reason for that too.", "The front part of the brain (the prefrontal cortex) handles reasoning and keeps emotions in check. Fatigue and lack of sleep weaken it.", "Meanwhile the brain's emotional centre (the amygdala) starts reacting more strongly. Research has found that after sleep loss, the amygdala reacts roughly 60 percent more intensely.", "So someone lying awake late at night is often thinking with emotion, not reason. Small things feel huge, and hope feels far away. This too is a kind of darkness of the night — inside the mind."], "r": []}, {"h": "The night is a garment, sleep is rest", "p": ["Allah made the night, by nature, for rest. The Quran calls the night a \"garment\" — something that covers, protects and brings calm.", "The night is for recharging, not for using up. When we break this natural order, both body and mind pay the price.", "That is why the Prophet ﷺ disliked sleeping before Isha and idle talk after it."], "r": ["وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا ۝ وَجَعَلْنَا اللَّيْلَ لِبَاسًا — \"And We made your sleep a means of rest, and made the night a garment.\" (Surah An-Naba 78:9–10)", "Abu Barzah (RA) narrated that the Prophet ﷺ disliked sleeping before Isha and talking after it. (Sahih al-Bukhari 568)"]}, {"h": "Screen light and scrolling", "p": ["The blue light of a phone tricks the brain into thinking it is still daytime. Less melatonin — the sleep hormone — is made, so sleep comes late and stays shallow. Poor sleep, in turn, feeds anxiety and low mood.", "And scrolling steals more than sleep. Watching other people's curated, shining lives breeds a sense of lack and ingratitude.", "The \"bad decisions of the night\" — pointless arguments, temptation to sin, despair — mostly happen in these hours. They are all modern forms of the evil of the ghasiq."], "r": ["وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِّنْهُمْ زَهْرَةَ الْحَيَاةِ الدُّنْيَا — \"And do not extend your eyes toward what We have given some of them to enjoy — the splendour of the life of this world.\" (Surah Taha 20:131)"]}, {"h": "Two nights: one for Shaytan, one for Ar-Rahman", "p": ["The night has two faces. In one, a person lies awake alone in front of a screen, surrounded by thoughts — Shaytan's favourite night, because despair settles in easily there.", "In the other, a person either sleeps on time so they can wake with hope, or stays awake on the prayer mat.", "And the last part of the night is the very time when Allah Himself calls out to His servant. If you must stay awake, stay awake there — where there is no evil, only good."], "r": ["The Prophet ﷺ said: \"Our Lord descends every night to the lowest heaven when the last third of the night remains, and says: Who is calling upon Me, that I may answer him? Who is asking of Me, that I may give him? Who is seeking My forgiveness, that I may forgive him?\" (Sahih al-Bukhari 1145)"]}, {"h": "The key to a calm heart", "p": ["Peace of mind is directly tied to the remembrance of Allah and His words. The Quran is not only a book of rulings; it is also a \"cure\" — especially for the wounds no one can see.", "When your mind turns into a crowd of thoughts and the restlessness becomes too much, repeat this verse again and again.", "Repeating it settles a certainty in the heart that Allah, who has power over all things, is with me — and the shadows of fear begin to lift."], "r": ["الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ — \"Those who believe and whose hearts find rest in the remembrance of Allah. Surely, in the remembrance of Allah do hearts find rest.\" (Surah Ar-Ra'd 13:28)", "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ — \"And We send down in the Quran that which is a cure and a mercy for the believers.\" (Surah Al-Isra 17:82)"]}, {"h": "Ease \"with\" hardship", "p": ["Most overthinking comes from fear of what tomorrow will bring. Allah answered it in two short but complete verses.", "Notice: Allah did not say ease comes \"after\" hardship. He said ease is \"with\" hardship. Wherever the difficulty is, its way out is already there too — it just hasn't come into view yet.", "And it is said twice, so the heart can be fully sure."], "r": ["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا — \"So surely with hardship comes ease. Surely with hardship comes ease.\" (Surah Al-Inshirah 94:5–6)"]}, {"h": "The dua for worry and grief", "p": ["The Prophet ﷺ taught a dua that is a shield against the weight on the mind, and he used to say it often.", "Its most beautiful point is that it begins with \"hamm\" and \"hazan.\" Hamm is worry about the future; hazan is grief over the past. In today's language, these are the roots of anxiety and depression.", "So 1,400 years ago we were already taught to seek refuge with Allah from both."], "r": ["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ — \"O Allah, I seek refuge in You from worry and grief, from helplessness and laziness, from miserliness and cowardice, from the burden of debt and from being overpowered by people.\" (Sahih al-Bukhari 6369)"]}, {"h": "Handing the matter to Allah", "p": ["Some things are simply not in our hands. Thinking about them all night only eats away at sleep and health.", "For such moments, the Quran gives us a sentence spoken by a believer in front of his people. Keep it on your tongue.", "Tawakkul does not mean sitting back and doing nothing — it means doing your part and leaving the outcome to Allah."], "r": ["وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ ۚ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ — \"And I entrust my affair to Allah. Indeed, Allah sees His servants.\" (Surah Ghafir / Al-Mu'min 40:44)", "وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ — \"And whoever relies on Allah, He is sufficient for him.\" (Surah At-Talaq 65:3)"]}, {"h": "Two surahs, one fortress", "p": ["The last two surahs of the Quran — Al-Falaq and An-Nas — are called the \"Mu'awwidhatayn,\" the two surahs of refuge.", "Surah Al-Falaq is refuge from evil outside us: the darkness of night, magic and envy.", "Surah An-Nas is refuge from evil inside us: the whispers that slip quietly into the heart.", "Only Allah protects; these surahs are the way of asking Him for refuge that He Himself taught us. The Prophet ﷺ recited them every night before sleeping."], "r": ["Uqbah ibn Amir (RA) narrated that the Prophet ﷺ said: \"Do you not see that verses have been revealed tonight the like of which have never been seen — Qul a'udhu bi Rabbil-Falaq and Qul a'udhu bi Rabbin-Nas.\" (Sahih Muslim 814)", "Aisha (RA) said that every night when the Prophet ﷺ went to bed, he would join his palms, blow into them, recite Surah Al-Ikhlas, Al-Falaq and An-Nas, then wipe them over as much of his body as he could reach. He did this three times. (Sahih al-Bukhari 5017)"]}, {"h": "A practical routine before sleep", "p": ["Psychologists also say that shifting your attention helps when you are anxious. Islam turned this into a daily habit:", "1. Put the phone away: screens off at least half an hour before sleep.", "2. Make fresh wudu: the Prophet ﷺ advised wudu before sleeping. Cool water lightens both body and mind.", "3. If you are troubled, pray two rak'ahs: put your head in sujood and lay everything before Allah. Crying before Allah saves you from crying before people.", "4. Recite Ayat al-Kursi and the three Quls, lie on your right side, and say the dua for sleep.", "5. Sleep early: sleeping on time solves half the problems of the night."], "r": ["Al-Bara' ibn Azib (RA) narrated that the Prophet ﷺ said: \"When you go to your bed, perform wudu as you do for prayer, then lie on your right side.\" (Sahih al-Bukhari 247)", "Hudhayfah (RA) said that whenever something distressed the Prophet ﷺ, he would pray. (Sunan Abi Dawud 1319)", "The Prophet ﷺ said: \"When you go to bed, recite Ayat al-Kursi; a guardian from Allah will stay with you and Shaytan will not come near you until morning.\" (Sahih al-Bukhari 5010)", "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا — \"O Allah, in Your name I die (sleep) and I live (wake).\" (Sahih al-Bukhari 6324)"]}, {"h": "Duas for deep distress", "p": ["When a very heavy time falls on the heart, the Prophet ﷺ would say this dua. It is known as \"Dua al-Karb,\" the dua for severe distress.", "And the dua that Prophet Yunus (AS) made in the darkness of the whale's belly — darkness within darkness — is for us too. The Prophet ﷺ said that any Muslim who calls upon Allah with it, in any matter, will have his dua answered."], "r": ["لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ — \"There is no god but Allah, the Magnificent, the Forbearing. There is no god but Allah, Lord of the Mighty Throne. There is no god but Allah, Lord of the heavens, Lord of the earth and Lord of the Noble Throne.\" (Sahih al-Bukhari 6346, Sahih Muslim 2730)", "لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ — \"There is no god but You, glory be to You; indeed I have been among the wrongdoers.\" (Surah Al-Anbiya 21:87, Jami' at-Tirmidhi 3505)"]}, {"h": "A final word", "p": ["The darkness of the night does not last long. After every night comes a morning — that is both Allah's design and His sign.", "Next time your mind feels heavy at night, put the phone down, make wudu, recite the three Quls and sleep. Or spread the prayer mat and tell your story to the One who Himself calls out in the last part of the night.", "Because the evil of the night is real — but Allah's refuge is far stronger."], "r": []}], "ro": [{"h": "Raat hi kyun?", "p": ["Quran ki aakhri surton mein se ek, Surah Al-Falaq, humein ek khaas cheez se panah maangna sikhati hai: \"andheray ke shar se, jab woh chha jaye.\"", "Din mein bhi shar hota hai, phir raat ka zikr alag se kyun? Kyunke raat mein insaan akela hota hai, thaka hua hota hai, aur us ke apne khayalaat us par sab se zyada bhaari hote hain.", "Yeh tehreer isi sawal ka jawab hai: raat ka shar kya hai, yeh humein kaise ghera leta hai, aur Quran o Sunnat ne is se bachne ke liye humein kya diya hai."], "r": ["وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ — \"Aur andheri raat ke shar se, jab woh chha jaye.\" (Surah Al-Falaq 113:3)", "Hazrat Aisha (RA) farmati hain ke Nabi ﷺ ne chaand ki taraf dekha aur farmaya: \"Aye Aisha! Is ke shar se Allah ki panah maango, yehi woh ghasiq hai jab woh chha jaye.\" (Jami' Tirmidhi 3366)"]}, {"h": "\"Ghasiq\" — sirf andhera nahi", "p": ["Arabi mein \"ghasiq\" us andheray ko kehte hain jo aahista aahista phailta hai aur har cheez ko apni lapet mein le leta hai.", "Mufassireen likhte hain ke raat ke waqt woh cheezein bahar nikalti hain jo din ki roshni mein chhupi rehti hain. Yeh baat jismani khatron par bhi sach hai aur zehni khatron par bhi.", "Aaj ke insaan ke liye raat ka sab se bara shar aksar andar ka hota hai:", "Waswasay (Intrusive Thoughts): jo khayalaat din ke shor mein dab jaate hain, raat ki khamoshi mein woh naag ki tarah sar uthate hain.", "Pachhtaway (Regrets): din mein insaan kal ki sochta hai, raat ko guzra hua kal lot aata hai — purani baatein, purani ghaltiyan, purane zakhm."], "r": []}, {"h": "Raat 2 baje ka \"pahaar\"", "p": ["Kabhi aisa hua hai ke raat ko koi masla pahaar lage, aur subah uth kar wohi masla chhota sa nazar aaye? Is ki ek science wali wajah bhi hai.", "Dimagh ka agla hissa (Prefrontal Cortex) sochne samajhne aur jazbaat ko qaabu mein rakhne ka kaam karta hai. Thakan aur neend ki kami mein yeh hissa kamzor par jata hai.", "Jabke dimagh ka jazbaati hissa (Amygdala) zyada tez react karne lagta hai. Tehqeeq ke mutabiq neend ki kami mein amygdala taqreeban 60 feesad zyada shiddat se react karta hai.", "Yani raat ko der tak jaagta hua insaan aksar dalil se nahi, jazbaat se soch raha hota hai. Chhoti baat bari lagti hai, aur umeed door. Yeh bhi raat ke andheray ka ek zehni roop hai."], "r": []}, {"h": "Raat libaas hai, neend sukoon", "p": ["Allah ne raat ko fitrat mein aaram ke liye banaya hai. Quran raat ko \"libaas\" kehta hai — jo dhaanp le, hifazat kare aur sukoon de.", "Raat \"charging\" ka waqt hai, \"istemaal\" ka nahi. Jab hum is fitri tarteeb ko torte hain, to jism aur zehn dono is ki qeemat chukate hain.", "Isi liye Nabi ﷺ Isha se pehle sona aur Isha ke baad fuzool baatein karna na-pasand farmate the."], "r": ["وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا ۝ وَجَعَلْنَا اللَّيْلَ لِبَاسًا — \"Aur hum ne tumhari neend ko aaram ka zariya banaya, aur raat ko libaas banaya.\" (Surah An-Naba 78:9–10)", "Hazrat Abu Barzah (RA) se riwayat hai ke Nabi ﷺ Isha se pehle sone aur us ke baad baatein karne ko na-pasand farmate the. (Sahih Bukhari 568)"]}, {"h": "Screen ki roshni aur scrolling", "p": ["Mobile ki neeli roshni (Blue Light) dimagh ko yeh dhoka deti hai ke abhi din hai. Is se neend ka hormone (Melatonin) kam banta hai, neend der se aati hai aur kachi rehti hai. Kharab neend aage chal kar bechaini aur udaasi ko barhati hai.", "Aur scrolling sirf neend nahi churaati. Doosron ki chuni hui, chamakti hui zindagiyan dekh kar dil mein kami ka ehsaas (Inferiority Complex) aur na-shukri paida hoti hai.", "\"Raat ke ghalat faisle\" — fuzool behsein, gunah ki targheeb, mayoosi — aksar isi waqt hote hain. Yeh sab \"shar-e-ghasiq\" ki jadeed shaklein hain."], "r": ["وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِّنْهُمْ زَهْرَةَ الْحَيَاةِ الدُّنْيَا — \"Aur apni nigaahein un cheezon ki taraf na phailao jo hum ne un mein se kuch logon ko duniya ki zeenat ke taur par de rakhi hain.\" (Surah Taha 20:131)"]}, {"h": "Do raatein: ek shaitan ki, ek Rehman ki", "p": ["Raat ke do rukh hain. Ek raat woh hai jahan insaan screen ke saamne, akela, khayalaat mein ghira jaagta hai — yeh shaitan ki pasandeeda raat hai, kyunke yahan mayoosi aasani se ghar karti hai.", "Doosri raat woh hai jahan insaan ya to waqt par so jata hai taake subah umeed ke saath uthe, ya phir musallay par jaagta hai.", "Aur raat ka aakhri hissa to woh waqt hai jab khud Allah apne bande ko pukarta hai. Jaagna hi hai to wahan jaagein, jahan \"shar\" nahi, sirf \"khair\" hai."], "r": ["Nabi ﷺ ne farmaya: \"Humara Rab har raat, jab raat ka aakhri tihaai hissa baaqi hota hai, aasman-e-duniya par nuzool farmata hai aur kehta hai: kaun hai jo mujhe pukare ke main us ki dua qubool karun? Kaun hai jo mujh se maange ke main use doon? Kaun hai jo mujh se maafi maange ke main use maaf karun?\" (Sahih Bukhari 1145)"]}, {"h": "Dilon ke itminaan ki kunji", "p": ["Zehni sukoon ka seedha taalluq Allah ke zikr aur us ke kalaam se hai. Quran sirf ahkaam ki kitaab nahi, yeh \"shifa\" bhi hai — khaas taur par un zakhmon ke liye jo nazar nahi aate.", "Jab zehn khayalaat ka mela ban jaye aur bechaini hadd se barh jaye, to is aayat ko baar baar dohraiye.", "Baar baar dohrane se dil mein yeh yaqeen baithta hai ke Allah, jo har cheez par qaadir hai, mere saath hai — aur khauf ke saaye chhatne lagte hain."], "r": ["الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ — \"Jo log imaan laaye aur un ke dil Allah ke zikr se itminaan paate hain. Yaad rakho! Allah ke zikr hi se dilon ko itminaan milta hai.\" (Surah Ar-Ra'd 13:28)", "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ — \"Aur hum Quran mein woh cheez nazil karte hain jo imaan waalon ke liye shifa aur rehmat hai.\" (Surah Al-Isra 17:82)"]}, {"h": "Mushkil ke \"saath\" aasani", "p": ["Zyada tar overthinking aane wale kal ke khauf se hoti hai. Allah ne is ka jawab do chhoti magar poori aayaat mein de diya.", "Ghaur kijiye: Allah ne yeh nahi farmaya ke mushkil ke \"baad\" aasani hai, balke farmaya mushkil ke \"saath\" aasani hai. Yani jahan pareshani hai, wahin us ka hal bhi mojood hai — bas nazar aana baaqi hai.", "Aur yeh baat do dafa dohrayi gayi, taake dil ko poora yaqeen aa jaye."], "r": ["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا — \"Pas yaqeenan mushkil ke saath aasani hai, beshak mushkil ke saath aasani hai.\" (Surah Al-Inshirah 94:5–6)"]}, {"h": "Fikr aur gham ki dua", "p": ["Nabi ﷺ ne ek aisi dua sikhai jo zehni bojh ke khilaaf dhaal hai. Aap ﷺ yeh dua kasrat se parha karte the.", "Is dua ka sab se pyara nukta yeh hai ke is ki shuruaat \"hamm\" aur \"hazan\" se hoti hai. \"Hamm\" aane wale kal ki fikr hai, aur \"hazan\" guzre hue kal ka gham. Aaj ki zubaan mein yehi anxiety aur depression ki jarr hain.", "Yani 1400 saal pehle hi humein sikha diya gaya ke in dono se Allah ki panah maango."], "r": ["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ — \"Aye Allah! Main teri panah maangta hoon fikr aur gham se, be-basi aur susti se, kanjoosi aur buzdili se, qarz ke bojh aur logon ke dabaao se.\" (Sahih Bukhari 6369)"]}, {"h": "Maamla Allah ke supurd", "p": ["Kuch baatein humare ikhtiyar mein hoti hi nahi. Un par raat bhar sochna sirf neend aur sehat khata hai.", "Aise waqt ke liye Quran ne ek fiqra diya hai jo ek momin ne apni qaum ke saamne kaha tha. Ise zubaan par jaari rakhiye.", "Tawakkul ka matlab haath par haath rakh kar baithna nahi — apni koshish kar ke nateeja Allah par chhor dena hai."], "r": ["وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ ۚ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ — \"Aur main apna maamla Allah ke supurd karta hoon, beshak Allah apne bandon ko dekh raha hai.\" (Surah Ghafir / Al-Mu'min 40:44)", "وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ — \"Aur jo Allah par bharosa kare, to woh us ke liye kaafi hai.\" (Surah At-Talaq 65:3)"]}, {"h": "Do surtein, ek hisaar", "p": ["Quran ki aakhri do surtein — Al-Falaq aur An-Naas — ko \"Mu'awwizatain\" kaha jata hai, yani panah dilaane wali do surtein.", "Surah Al-Falaq bahar ke shar se panah hai: raat ka andhera, jaadu aur hasad.", "Surah An-Naas andar ke shar se panah hai: woh waswasay jo dil mein chupke se aate hain.", "Hifazat karne wala sirf Allah hai; yeh surtein us se panah maangne ka woh tareeqa hain jo Us ne khud sikhaya. Nabi ﷺ roz raat sone se pehle inhein parhte the."], "r": ["Hazrat Uqbah bin Aamir (RA) se riwayat hai ke Nabi ﷺ ne farmaya: \"Kya tumhein maloom nahi ke aaj raat aisi aayaat nazil hui hain jin jaisi kabhi nahi dekhi gayi — Qul a'oozu bi Rabbil Falaq aur Qul a'oozu bi Rabbin Naas.\" (Sahih Muslim 814)", "Hazrat Aisha (RA) farmati hain ke Nabi ﷺ har raat bistar par aate to dono hatheliyan jor kar un mein phoonkte, Surah Al-Ikhlas, Al-Falaq aur An-Naas parhte, phir jahan tak haath pahunchta apne jism par pherte. Yeh teen dafa karte. (Sahih Bukhari 5017)"]}, {"h": "Sone se pehle ka amli nuskha", "p": ["Nafsiyati maahireen bhi kehte hain ke pareshani mein tawajjo badal dena madad karta hai. Islam ne yeh kaam roz ki aadat bana diya hai:", "1. Phone door rakhein: sone se kam az kam aadha ghanta pehle screen band.", "2. Taaza wuzu karein: Nabi ﷺ ne sone se pehle wuzu ki talqeen farmayi. Thanda paani jism aur zehn dono ko halka karta hai.", "3. Pareshani ho to do rakat: sajde mein sar rakh kar saari baatein Allah ke saamne rakh dein. Allah ke saamne rona insaan ko logon ke saamne rone se bacha leta hai.", "4. Ayat-ul-Kursi aur teeno Qul parh kar, daayein karwat let kar, sone ki dua parhein.", "5. Jaldi so jayein: raat ko waqt par sona aadhe masail ka hal hai."], "r": ["Hazrat Bara' bin Aazib (RA) se riwayat hai ke Nabi ﷺ ne farmaya: \"Jab tum apne bistar par jao to namaz wala wuzu karo, phir daayein karwat let jao.\" (Sahih Bukhari 247)", "Hazrat Huzaifa (RA) farmate hain ke jab Nabi ﷺ ko koi maamla pareshan karta to aap ﷺ namaz parhte. (Sunan Abi Dawud 1319)", "Nabi ﷺ ne farmaya: \"Jab tum bistar par jao to Ayat-ul-Kursi parho, Allah ki taraf se tum par ek muhafiz muqarrar rahega aur subah tak shaitan tumhare qareeb nahi aayega.\" (Sahih Bukhari 5010)", "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا — \"Aye Allah! Tere hi naam ke saath marta (sota) hoon aur jeeta (jaagta) hoon.\" (Sahih Bukhari 6324)"]}, {"h": "Shadeed pareshani ki duaein", "p": ["Jab dil par bohat bhaari waqt ho, to Nabi ﷺ yeh dua parhte the. Ise \"Dua-e-Karb\" yani sakht bechaini ki dua kaha jata hai.", "Aur Hazrat Yunus (AS) ne machhli ke pait ke andheron mein — andheray ke andar andhera — jo dua ki, woh bhi humare liye hai. Nabi ﷺ ne farmaya ke jo Musalman is dua ke saath kisi bhi maamle mein pukare, Allah us ki dua qubool farmata hai."], "r": ["لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ — \"Allah ke siwa koi mabood nahi jo azmat wala aur burdbaar hai. Allah ke siwa koi mabood nahi jo arsh-e-azeem ka Rab hai. Allah ke siwa koi mabood nahi jo aasmanon ka Rab, zameen ka Rab aur arsh-e-kareem ka Rab hai.\" (Sahih Bukhari 6346, Sahih Muslim 2730)", "لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ — \"Tere siwa koi mabood nahi, tu paak hai, beshak main hi zaalimon mein se tha.\" (Surah Al-Anbiya 21:87, Jami' Tirmidhi 3505)"]}, {"h": "Aakhri baat", "p": ["Raat ka andhera zyada der nahi rehta. Har raat ke baad subah aati hai — yeh Allah ki banayi hui tarteeb bhi hai aur us ki nishani bhi.", "Agli dafa jab raat ko zehn bhaari ho, to phone rakh kar, wuzu kar ke, teeno Qul parh kar so jaiye. Ya phir musallay bichha kar apni baat Us se keh dijiye jo raat ke aakhri hisse mein khud pukarta hai.", "Kyunke raat ka shar asli hai — magar Allah ki panah us se kahin zyada mazboot hai."], "r": []}], "ur": [{"h": "رات ہی کیوں؟", "p": ["قرآن کی آخری سورتوں میں سے ایک، سورۃ الفلق، ہمیں ایک خاص چیز سے پناہ مانگنا سکھاتی ہے: ”اندھیرے کے شر سے، جب وہ چھا جائے۔“", "دن میں بھی شر ہوتا ہے، پھر رات کا ذکر الگ سے کیوں؟ کیونکہ رات میں انسان اکیلا ہوتا ہے، تھکا ہوا ہوتا ہے، اور اس کے اپنے خیالات اس پر سب سے زیادہ بھاری ہوتے ہیں۔", "یہ تحریر اسی سوال کا جواب ہے: رات کا شر کیا ہے، یہ ہمیں کیسے گھیر لیتا ہے، اور قرآن و سنت نے اس سے بچنے کے لیے ہمیں کیا دیا ہے۔"], "r": ["وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ — ”اور اندھیری رات کے شر سے، جب وہ چھا جائے۔“ (سورۃ الفلق 113:3)", "حضرت عائشہؓ فرماتی ہیں کہ نبی ﷺ نے چاند کی طرف دیکھا اور فرمایا: ”اے عائشہ! اس کے شر سے اللہ کی پناہ مانگو، یہی وہ غاسق ہے جب وہ چھا جائے۔“ (جامع ترمذی 3366)"]}, {"h": "”غاسق“ — صرف اندھیرا نہیں", "p": ["عربی میں ”غاسق“ اس اندھیرے کو کہتے ہیں جو آہستہ آہستہ پھیلتا ہے اور ہر چیز کو اپنی لپیٹ میں لے لیتا ہے۔", "مفسرین لکھتے ہیں کہ رات کے وقت وہ چیزیں باہر نکلتی ہیں جو دن کی روشنی میں چھپی رہتی ہیں۔ یہ بات جسمانی خطروں پر بھی سچ ہے اور ذہنی خطروں پر بھی۔", "آج کے انسان کے لیے رات کا سب سے بڑا شر اکثر اندر کا ہوتا ہے:", "وسوسے: جو خیالات دن کے شور میں دب جاتے ہیں، رات کی خاموشی میں وہ ناگ کی طرح سر اٹھاتے ہیں۔", "پچھتاوے: دن میں انسان کل کی سوچتا ہے، رات کو گزرا ہوا کل لوٹ آتا ہے — پرانی باتیں، پرانی غلطیاں، پرانے زخم۔"], "r": []}, {"h": "رات دو بجے کا ”پہاڑ“", "p": ["کبھی ایسا ہوا ہے کہ رات کو کوئی مسئلہ پہاڑ لگے، اور صبح اٹھ کر وہی مسئلہ چھوٹا سا نظر آئے؟ اس کی ایک سائنسی وجہ بھی ہے۔", "دماغ کا اگلا حصہ (پری فرنٹل کارٹیکس) سوچنے سمجھنے اور جذبات کو قابو میں رکھنے کا کام کرتا ہے۔ تھکن اور نیند کی کمی میں یہ حصہ کمزور پڑ جاتا ہے۔", "جبکہ دماغ کا جذباتی حصہ (امیگڈالا) زیادہ تیز ردِعمل دینے لگتا ہے۔ تحقیق کے مطابق نیند کی کمی میں امیگڈالا تقریباً ساٹھ فیصد زیادہ شدت سے ردِعمل دیتا ہے۔", "یعنی رات کو دیر تک جاگتا ہوا انسان اکثر دلیل سے نہیں، جذبات سے سوچ رہا ہوتا ہے۔ چھوٹی بات بڑی لگتی ہے، اور امید دور۔ یہ بھی رات کے اندھیرے کا ایک ذہنی روپ ہے۔"], "r": []}, {"h": "رات لباس ہے، نیند سکون", "p": ["اللہ نے رات کو فطرت میں آرام کے لیے بنایا ہے۔ قرآن رات کو ”لباس“ کہتا ہے — جو ڈھانپ لے، حفاظت کرے اور سکون دے۔", "رات ”چارجنگ“ کا وقت ہے، ”استعمال“ کا نہیں۔ جب ہم اس فطری ترتیب کو توڑتے ہیں تو جسم اور ذہن دونوں اس کی قیمت چکاتے ہیں۔", "اسی لیے نبی ﷺ عشاء سے پہلے سونا اور عشاء کے بعد فضول باتیں کرنا ناپسند فرماتے تھے۔"], "r": ["وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا ۝ وَجَعَلْنَا اللَّيْلَ لِبَاسًا — ”اور ہم نے تمہاری نیند کو آرام کا ذریعہ بنایا، اور رات کو لباس بنایا۔“ (سورۃ النبا 78:9–10)", "حضرت ابو برزہؓ سے روایت ہے کہ نبی ﷺ عشاء سے پہلے سونے اور اس کے بعد باتیں کرنے کو ناپسند فرماتے تھے۔ (صحیح بخاری 568)"]}, {"h": "اسکرین کی روشنی اور اسکرولنگ", "p": ["موبائل کی نیلی روشنی دماغ کو یہ دھوکا دیتی ہے کہ ابھی دن ہے۔ اس سے نیند کا ہارمون (میلاٹونن) کم بنتا ہے، نیند دیر سے آتی ہے اور کچی رہتی ہے۔ خراب نیند آگے چل کر بےچینی اور اداسی کو بڑھاتی ہے۔", "اور اسکرولنگ صرف نیند نہیں چراتی۔ دوسروں کی چنی ہوئی، چمکتی ہوئی زندگیاں دیکھ کر دل میں کمی کا احساس اور ناشکری پیدا ہوتی ہے۔", "”رات کے غلط فیصلے“ — فضول بحثیں، گناہ کی ترغیب، مایوسی — اکثر اسی وقت ہوتے ہیں۔ یہ سب ”شرِ غاسق“ کی جدید شکلیں ہیں۔"], "r": ["وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِّنْهُمْ زَهْرَةَ الْحَيَاةِ الدُّنْيَا — ”اور اپنی نگاہیں ان چیزوں کی طرف نہ پھیلاؤ جو ہم نے ان میں سے کچھ لوگوں کو دنیا کی زینت کے طور پر دے رکھی ہیں۔“ (سورۃ طٰہٰ 20:131)"]}, {"h": "دو راتیں: ایک شیطان کی، ایک رحمٰن کی", "p": ["رات کے دو رخ ہیں۔ ایک رات وہ ہے جہاں انسان اسکرین کے سامنے، اکیلا، خیالات میں گھرا جاگتا ہے — یہ شیطان کی پسندیدہ رات ہے، کیونکہ یہاں مایوسی آسانی سے گھر کرتی ہے۔", "دوسری رات وہ ہے جہاں انسان یا تو وقت پر سو جاتا ہے تاکہ صبح امید کے ساتھ اٹھے، یا پھر مصلے پر جاگتا ہے۔", "اور رات کا آخری حصہ تو وہ وقت ہے جب خود اللہ اپنے بندے کو پکارتا ہے۔ جاگنا ہی ہے تو وہاں جاگیں، جہاں ”شر“ نہیں، صرف ”خیر“ ہے۔"], "r": ["نبی ﷺ نے فرمایا: ”ہمارا رب ہر رات، جب رات کا آخری تہائی حصہ باقی ہوتا ہے، آسمانِ دنیا پر نزول فرماتا ہے اور کہتا ہے: کون ہے جو مجھے پکارے کہ میں اس کی دعا قبول کروں؟ کون ہے جو مجھ سے مانگے کہ میں اسے دوں؟ کون ہے جو مجھ سے معافی مانگے کہ میں اسے معاف کروں؟“ (صحیح بخاری 1145)"]}, {"h": "دلوں کے اطمینان کی کنجی", "p": ["ذہنی سکون کا سیدھا تعلق اللہ کے ذکر اور اس کے کلام سے ہے۔ قرآن صرف احکام کی کتاب نہیں، یہ ”شفا“ بھی ہے — خاص طور پر ان زخموں کے لیے جو نظر نہیں آتے۔", "جب ذہن خیالات کا میلہ بن جائے اور بےچینی حد سے بڑھ جائے، تو اس آیت کو بار بار دہرائیے۔", "بار بار دہرانے سے دل میں یہ یقین بیٹھتا ہے کہ اللہ، جو ہر چیز پر قادر ہے، میرے ساتھ ہے — اور خوف کے سائے چھٹنے لگتے ہیں۔"], "r": ["الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ — ”جو لوگ ایمان لائے اور ان کے دل اللہ کے ذکر سے اطمینان پاتے ہیں۔ یاد رکھو! اللہ کے ذکر ہی سے دلوں کو اطمینان ملتا ہے۔“ (سورۃ الرعد 13:28)", "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ — ”اور ہم قرآن میں وہ چیز نازل کرتے ہیں جو ایمان والوں کے لیے شفا اور رحمت ہے۔“ (سورۃ الاسراء 17:82)"]}, {"h": "مشکل کے ”ساتھ“ آسانی", "p": ["زیادہ تر اوورتھنکنگ آنے والے کل کے خوف سے ہوتی ہے۔ اللہ نے اس کا جواب دو چھوٹی مگر پوری آیات میں دے دیا۔", "غور کیجیے: اللہ نے یہ نہیں فرمایا کہ مشکل کے ”بعد“ آسانی ہے، بلکہ فرمایا مشکل کے ”ساتھ“ آسانی ہے۔ یعنی جہاں پریشانی ہے، وہیں اس کا حل بھی موجود ہے — بس نظر آنا باقی ہے۔", "اور یہ بات دو دفعہ دہرائی گئی، تاکہ دل کو پورا یقین آ جائے۔"], "r": ["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا — ”پس یقیناً مشکل کے ساتھ آسانی ہے، بےشک مشکل کے ساتھ آسانی ہے۔“ (سورۃ الانشراح 94:5–6)"]}, {"h": "فکر اور غم کی دعا", "p": ["نبی ﷺ نے ایک ایسی دعا سکھائی جو ذہنی بوجھ کے خلاف ڈھال ہے۔ آپ ﷺ یہ دعا کثرت سے پڑھا کرتے تھے۔", "اس دعا کا سب سے پیارا نکتہ یہ ہے کہ اس کی شروعات ”ہَمّ“ اور ”حَزَن“ سے ہوتی ہے۔ ”ہَمّ“ آنے والے کل کی فکر ہے، اور ”حَزَن“ گزرے ہوئے کل کا غم۔ آج کی زبان میں یہی اینزائٹی اور ڈپریشن کی جڑ ہیں۔", "یعنی چودہ سو سال پہلے ہی ہمیں سکھا دیا گیا کہ ان دونوں سے اللہ کی پناہ مانگو۔"], "r": ["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ — ”اے اللہ! میں تیری پناہ مانگتا ہوں فکر اور غم سے، بےبسی اور سستی سے، کنجوسی اور بزدلی سے، قرض کے بوجھ اور لوگوں کے دباؤ سے۔“ (صحیح بخاری 6369)"]}, {"h": "معاملہ اللہ کے سپرد", "p": ["کچھ باتیں ہمارے اختیار میں ہوتی ہی نہیں۔ ان پر رات بھر سوچنا صرف نیند اور صحت کھاتا ہے۔", "ایسے وقت کے لیے قرآن نے ایک فقرہ دیا ہے جو ایک مومن نے اپنی قوم کے سامنے کہا تھا۔ اسے زبان پر جاری رکھیے۔", "توکل کا مطلب ہاتھ پر ہاتھ رکھ کر بیٹھنا نہیں — اپنی کوشش کر کے نتیجہ اللہ پر چھوڑ دینا ہے۔"], "r": ["وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ ۚ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ — ”اور میں اپنا معاملہ اللہ کے سپرد کرتا ہوں، بےشک اللہ اپنے بندوں کو دیکھ رہا ہے۔“ (سورۃ غافر / المؤمن 40:44)", "وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ — ”اور جو اللہ پر بھروسہ کرے، تو وہ اس کے لیے کافی ہے۔“ (سورۃ الطلاق 65:3)"]}, {"h": "دو سورتیں، ایک حصار", "p": ["قرآن کی آخری دو سورتیں — الفلق اور الناس — کو ”معوذتین“ کہا جاتا ہے، یعنی پناہ دلانے والی دو سورتیں۔", "سورۃ الفلق باہر کے شر سے پناہ ہے: رات کا اندھیرا، جادو اور حسد۔", "سورۃ الناس اندر کے شر سے پناہ ہے: وہ وسوسے جو دل میں چپکے سے آتے ہیں۔", "حفاظت کرنے والا صرف اللہ ہے؛ یہ سورتیں اس سے پناہ مانگنے کا وہ طریقہ ہیں جو اس نے خود سکھایا۔ نبی ﷺ روز رات سونے سے پہلے انہیں پڑھتے تھے۔"], "r": ["حضرت عقبہ بن عامرؓ سے روایت ہے کہ نبی ﷺ نے فرمایا: ”کیا تمہیں معلوم نہیں کہ آج رات ایسی آیات نازل ہوئی ہیں جن جیسی کبھی نہیں دیکھی گئیں — قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ اور قُلْ أَعُوذُ بِرَبِّ النَّاسِ۔“ (صحیح مسلم 814)", "حضرت عائشہؓ فرماتی ہیں کہ نبی ﷺ ہر رات بستر پر آتے تو دونوں ہتھیلیاں جوڑ کر ان میں پھونکتے، سورۃ الاخلاص، الفلق اور الناس پڑھتے، پھر جہاں تک ہاتھ پہنچتا اپنے جسم پر پھیرتے۔ یہ تین دفعہ کرتے۔ (صحیح بخاری 5017)"]}, {"h": "سونے سے پہلے کا عملی نسخہ", "p": ["نفسیاتی ماہرین بھی کہتے ہیں کہ پریشانی میں توجہ بدل دینا مدد کرتا ہے۔ اسلام نے یہ کام روز کی عادت بنا دیا ہے:", "1. فون دور رکھیں: سونے سے کم از کم آدھا گھنٹہ پہلے اسکرین بند۔", "2. تازہ وضو کریں: نبی ﷺ نے سونے سے پہلے وضو کی تلقین فرمائی۔ ٹھنڈا پانی جسم اور ذہن دونوں کو ہلکا کرتا ہے۔", "3. پریشانی ہو تو دو رکعت: سجدے میں سر رکھ کر ساری باتیں اللہ کے سامنے رکھ دیں۔ اللہ کے سامنے رونا انسان کو لوگوں کے سامنے رونے سے بچا لیتا ہے۔", "4. آیت الکرسی اور تینوں قل پڑھ کر، دائیں کروٹ لیٹ کر، سونے کی دعا پڑھیں۔", "5. جلدی سو جائیں: رات کو وقت پر سونا آدھے مسائل کا حل ہے۔"], "r": ["حضرت براء بن عازبؓ سے روایت ہے کہ نبی ﷺ نے فرمایا: ”جب تم اپنے بستر پر جاؤ تو نماز والا وضو کرو، پھر دائیں کروٹ لیٹ جاؤ۔“ (صحیح بخاری 247)", "حضرت حذیفہؓ فرماتے ہیں کہ جب نبی ﷺ کو کوئی معاملہ پریشان کرتا تو آپ ﷺ نماز پڑھتے۔ (سنن ابی داؤد 1319)", "نبی ﷺ نے فرمایا: ”جب تم بستر پر جاؤ تو آیت الکرسی پڑھو، اللہ کی طرف سے تم پر ایک محافظ مقرر رہے گا اور صبح تک شیطان تمہارے قریب نہیں const doc = document.getElementById('doc');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(l){
  const u = D.ui[l], secs = D.data[l];
  let h = `<header class="cover"><p class="kicker">${esc(u.kicker)}</p><h1>${esc(u.title)}</h1><p class="byline">${esc(u.by)}</p><p class="sub">${esc(u.sub)}</p>`
    + `<ul class="meta">` + u.meta.map(m=>`<li>${esc(m)}</li>`).join('') + `</ul>`
    + `<p class="for">${esc(u.for)}</p>`
    + `<a class="go" href="#s1">${esc(u.start)} <span aria-hidden="true">↓</span></a>`
    + `<blockquote class="pull">${esc(u.quote)}</blockquote>`
    + `<details class="toc"><summary>${esc(u.toc)}</summary><ol>` + secs.map((s,i)=>`<li><a href="#s${i+1}">${esc(s.h)}</a></li>`).join('') + `</ol></details>`
    + `</header>`;
  secs.forEach((s,i)=>{
    h += `<section id="s${i+1}"><h2>${esc(s.h)}</h2>` + s.p.map(p=>`<p>${esc(p)}</p>`).join('');
    if (s.r && s.r.length) h += `<aside class="ref"><div class="tag">${esc(u.ref)}</div>` + s.r.map(r=>`<p>${esc(r)}</p>`).join('') + `</aside>`;
    h += `</section>`;
  });
  h += `<div class="foot"><h2>${esc(u.refs)}</h2><ul>` + D.refs[l].map(r=>`<li>${esc(r)}</li>`).join('') + `</ul></div>`;
  doc.innerHTML = h;
  doc.setAttribute('dir', l==='ur' ? 'rtl' : 'ltr');
  doc.setAttribute('lang', l==='ur' ? 'ur' : l==='ro' ? 'ur-Latn' : 'en');
  document.getElementById('lbl').textContent = u.read;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===l));
  try{ localStorage.setItem('ilm-lang', l); }catch(e){}
}
function pick(l){
  doc.classList.add('fade');
  setTimeout(()=>{ render(l); doc.classList.remove('fade'); window.scrollTo({top:0}); }, 120);
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.l)));
let start = 'en';
try{ const s = localStorage.getItem('ilm-lang'); if (s && D.data[s]) start = s; }catch(e){}
const q = new URLSearchParams(location.search).get('lang'); if (q && D.data[q]) start = q;
render(start);
</script>
